apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
  - port: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: 905765459973.dkr.ecr.us-east-2.amazonaws.com/api:latest
        ports:
        - containerPort: 50051
        env:
        - name: MYSQL_ADDR
          value: mysql:6446
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-root
              key: rootPassword
        - name: TWEET0_ADDR
          value: tweets-0.tweets:50051
        - name: TWEET1_ADDR
          value: tweets-1.tweets:50051
        - name: TWEET2_ADDR
          value: tweets-2.tweets:50051
        - name: KAFKA_ADDRS
          value: kafka-0.kafka:9092
        - name: REDIS_ADDR
          value: REDIS_ADDR_HERE
