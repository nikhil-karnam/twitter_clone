apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-setup
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: kafka-setup
        image: apache/kafka:3.9.1
        command:
        - /opt/kafka/bin/kafka-topics.sh
        - --create
        - --if-not-exists
        - --topic
        - fanout
        - --partitions
        - "4"
        - --replication-factor
        - "1"
        - --bootstrap-server
        - kafka-0.kafka:9092
