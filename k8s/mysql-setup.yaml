apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-setup
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mysql-setup
        image: mysql:8.4
        env:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: mysql-root
              key: rootPassword
        command: ["bash", "-c"]
        args:
        - |
          set -e
          #wait until the group is up and the router can reach the primary
          until mysqladmin ping -h mysql -P 6446 -uroot --silent; do sleep 5; done
          #your exact table, created on the primary through the router
          mysql -h mysql -P 6446 -uroot -e "CREATE DATABASE IF NOT EXISTS twitter; CREATE TABLE IF NOT EXISTS twitter.users (username varchar(255) NOT NULL, email varchar(255) NOT NULL, follower_count int NOT NULL DEFAULT 0, PRIMARY KEY (username), UNIQUE KEY (email)); CREATE TABLE IF NOT EXISTS twitter.follows (user varchar(255) NOT NULL, target varchar(255) NOT NULL, PRIMARY KEY (user, target), KEY (target), FOREIGN KEY (user) REFERENCES twitter.users (username), FOREIGN KEY (target) REFERENCES twitter.users (username));"
