apiVersion: v1
kind: Secret
metadata:
  name: mysql-root
type: Opaque
stringData:
  rootUser: root
  rootHost: "%"
  rootPassword: root
---
apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: mysql
spec:
  secretName: mysql-root
  tlsUseSelfSigned: true
  instances: 3
  router:
    instances: 1
  datadirVolumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    storageClassName: ebs
    resources:
      requests:
        storage: 1Gi
