apiVersion: v1
kind: Service
metadata:
  name: tweets
spec:
  clusterIP: None
  selector:
    app: tweets
  ports:
  - port: 50051
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tweets
spec:
  serviceName: tweets
  replicas: 3
  selector:
    matchLabels:
      app: tweets
  template:
    metadata:
      labels:
        app: tweets
    spec:
      containers:
      - name: server
        image: 905765459973.dkr.ecr.us-east-2.amazonaws.com/pebble-server:latest
        args: ["/data", ":50051"]
        ports:
        - containerPort: 50051
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ebs
      resources:
        requests:
          storage: 1Gi
