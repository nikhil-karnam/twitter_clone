name: deploy

on:
  workflow_dispatch:

#never runs at the same time as destroy. waits if destroy is running
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  terraform:
    #keeps running if the run gets cancelled, so terraform always finishes cleanly
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      redis_addr: ${{ steps.tf.outputs.redis_addr }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: terraform
        id: tf
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve
          echo "redis_addr=$(terraform output -raw redis_addr)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: build and push
        run: |
          REG=905765459973.dkr.ecr.us-east-2.amazonaws.com
          docker build --build-arg CMD=server -t $REG/pebble-server:${{ github.sha }} .
          docker push $REG/pebble-server:${{ github.sha }}
          docker build --build-arg CMD=consumer -t $REG/kafka-consumer:${{ github.sha }} .
          docker push $REG/kafka-consumer:${{ github.sha }}
          docker build --build-arg CMD=api -t $REG/api:${{ github.sha }} .
          docker push $REG/api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-24.04
    needs: [terraform, build]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: deploy
        run: |
          aws eks update-kubeconfig --name twitter-cluster --region us-east-2
          kubectl apply -f https://raw.githubusercontent.com/mysql/mysql-operator/trunk/deploy/deploy-crds.yaml
          kubectl apply -f https://raw.githubusercontent.com/mysql/mysql-operator/trunk/deploy/deploy-operator.yaml
          kubectl wait --for=condition=established crd/innodbclusters.mysql.oracle.com
          kubectl rollout status deploy/mysql-operator -n mysql-operator --timeout=5m
          kubectl create secret generic mysql-root --from-literal=rootUser=root --from-literal=rootHost=% --from-literal=rootPassword=${{ secrets.MYSQL_ROOT_PASSWORD }} --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|:latest|:${{ github.sha }}|; s|REDIS_ADDR_HERE|${{ needs.terraform.outputs.redis_addr }}|" k8s/*.yaml
          kubectl apply -f k8s/
