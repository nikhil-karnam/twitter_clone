syntax = "proto3";

package api;

option go_package = "twitter_clone/api";

service Api {
  rpc Signup(Accounts) returns (Empty);
  rpc Follow(Follows) returns (Empty);
  rpc GetUsers(Empty) returns (Users);
  rpc SetThreshold(Threshold) returns (Empty);
}

message Accounts {
  repeated string users = 1;
  repeated string emails = 2;
}
message Follows {
  repeated string users = 1;
  repeated string targets = 2;
}
message Users {
  repeated string users = 1;
}
message Threshold {
  int64 value = 1;
}
message Empty {}
